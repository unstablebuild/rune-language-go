gui:
  env:
    GOROOT: '$RUNE_DATADIR/lib/$RUNE_PKG_ID'
    GOPATH: '$RUNE_DATADIR/go'
    GOBIN: '$RUNE_DATADIR/bin'
    GOMODCACHE: '$RUNE_DATADIR/go/pkg/mod'
    GOCACHE: '$RUNE_DATADIR/go/cache'
    # GOROOT pins the bundled toolchain. GOTOOLCHAIN=auto lets the `go`
    # command honor a repo's `toolchain goX.Y.Z` directive by downloading
    # the required version (cached under our GOPATH) instead of failing.
    # Without this, a user's exported GOTOOLCHAIN=local would force the
    # bundled version onto every repo and break ones that need another.
    GOTOOLCHAIN: 'auto'
extensions:
  go:
    path: '$RUNE_DATADIR/bin/extension_go'
    config:
      lsp_path: ""
      addr: localhost:6060
      logfile: /Users/ernestrc/.rune/logs/lsp/gopls.log
      # rpc_trace: true
      # trace: verbose
debugger:
  go:
    command: "dlv dap --listen={addr}"
    adapter_id: "dlv-dap"
    launch:
      mode: "debug"
      outputMode: "remote"
    attach:
      mode: "local"
lsp:
  icons:
    inline: "󰁔"
    escape: "󰁝"
    bounds: "󰅪"
    nilcheck: "∅"
    compiler: "⚙"
editor:
  icons:
    .go: 󰟓
  comments:
    go:
      line:
        - "//"
      block:
        - "/*"
        - "*/"
